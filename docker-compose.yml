# PostgreSQL + StudyVault API.
# Reads SECRET_KEY and GEMINI_API_KEY from .env in this folder.
#   docker compose up --build
# API: http://localhost:8000 (docs at /docs). Postgres is exposed on port 5433
# so it doesn't clash with a locally installed PostgreSQL on 5432.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: studyvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studyvault}
      POSTGRES_DB: studyvault
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates studyvault_test on first start, for running pytest against Docker
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyvault -d studyvault"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://studyvault:${POSTGRES_PASSWORD:-studyvault}@db:5432/studyvault
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
      - chroma:/data/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads:
  chroma:
